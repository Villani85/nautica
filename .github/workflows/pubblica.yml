name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compila:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # I CANCELLI GIRANO PRIMA DI PUBBLICARE, o non sono cancelli.
      #
      # Fino a oggi qui c'erano solo build e peso: i collaudi esistevano nel
      # repository e non fermavano niente. Li chiamavamo cancelli mentre una
      # regressione poteva arrivare in produzione lo stesso — segnalato da una
      # revisione esterna, e aveva ragione.
      - name: Collaudi del modello e della geometria
        run: npm run collaudo

      # L'impaginato ha bisogno di un browser. `playwright-core` non ne scarica
      # nessuno di proposito, quindi qui se ne installa uno; in locale si usa il
      # Chrome di sistema. Il collaudo gira headless e si accende la preview da
      # solo.
      - name: Collaudo dell'impaginato
        run: |
          npx playwright install --with-deps chromium
          npm run collaudo:impaginato

      # Il peso si misura a ogni pubblicazione e finisce nel registro della
      # corsa: se un giorno cresce, si vede quando e' successo e per cosa.
      - run: npm run peso
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pubblica:
    needs: compila
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblicazione.outputs.page_url }}
    steps:
      - id: pubblicazione
        uses: actions/deploy-pages@v4
