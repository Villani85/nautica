name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compila:
    # ─── UN PASSO PIANTATO DEVE ARRENDERSI, e senza questo non puo'
    #
    # Il 31 agosto la corsa 279 e' rimasta ferma quaranta minuti sullo stesso
    # passo senza fallire. Non era lenta e non era rotta: SENZA `timeout-minutes`
    # il limite e' quello di GitHub, sei ore. Una corsa che non si arrende non
    # produce un log del passo colpevole, quindi ogni diagnosi costa un'attesa --
    # e stasera ne e' costate tre.
    #
    # Venti non e' generoso: la catena ne impiega circa novanta in totale, ma un
    # SINGOLO cancello che ne prende venti e' piantato per definizione, visto che
    # il piu' lento in locale ne costa uno.
    # ─── I TETTI SONO TARATI SU UNA MISURA, non su un numero tondo
    #
    # Prima stesura: dieci minuti per passo, scelti a occhio. Sbagliato, e ha
    # fatto uscire rosse tre corse. Misurati i cancelli in locale, con la GPU:
    #
    #   collaudo-sollievo    41 s      collaudo-manopola   29 s
    #   collaudo-corsa       22 s      collaudo-varco      10 s
    #   collaudo-scia         9 s      collaudo-finale      7 s
    #
    # Il runner gira su rasterizzatore software e va circa quindici-venti volte
    # piu' piano: il piu' lento diventa dieci-tredici minuti. Con il tetto a
    # dieci lo ammazzavo io, e il referto diceva «fallito» senza distinguere
    # «piantato» da «ucciso». Venti minuti: il piu' lento ci sta con margine, e
    # venti minuti su un cancello che in locale ne costa quaranta secondi
    # significa piantato, non lento.
    #
    # Il tetto del JOB copre la catena intera, che ne impiega circa novanta. Il
    # cancello piu' lento in locale ne costa uno, quindi dieci minuti significa
    # piantato, non lento. Senza il tetto per passo, un solo cancello bloccato
    # consumerebbe comunque tutti i novanta e il log direbbe "scaduto" senza
    # dire quale -- che e' esattamente il buco di stasera.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 15
      - uses: actions/setup-node@v4
        timeout-minutes: 15
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # IL BROWSER SI INSTALLA PRIMA DI QUALUNQUE COLLAUDO.
      #
      # Difetto che ho introdotto io e che ha tenuto la CI rossa per undici
      # commit: `npm run collaudo` ha smesso di essere solo aritmetica quando
      # ci e' entrato `collaudo-continuita`, che apre una pagina vera. Ma
      # l'installazione di Chromium stava nello step SUCCESSIVO, e uno step che
      # viene dopo uno fallito non viene mai raggiunto.
      #
      # In locale non si vedeva, perche' in locale c'e' il Chrome di sistema:
      # e' il caso classico in cui l'ambiente di sviluppo nasconde il guasto
      # proprio a chi lo ha creato. `playwright-core` non scarica browser di
      # proposito — e' quello che tiene `npm ci` leggero — quindi qui va detto.
      # ffmpeg NON C'E' PIU' SUI RUNNER, e non da' un errore che lo dica.
      #
      # Era incluso nelle immagini `ubuntu-latest` e ne e' stato tolto. Il
      # cancello dei filmati lo invoca per estrarre i fotogrammi: senza, muore
      # con un ENOENT che parla di un file inesistente e non del programma
      # mancante. E' costato tre esecuzioni rosse, perche' la catena diceva
      # solo «lo step e' fallito».
      - name: ffmpeg per il cancello dei filmati
        timeout-minutes: 15
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Un browser per i collaudi
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium

      # I CANCELLI GIRANO PRIMA DI PUBBLICARE, o non sono cancelli.
      #
      # Fino a poco fa qui c'erano solo build e peso: i collaudi esistevano nel
      # repository e non fermavano niente. Li chiamavamo cancelli mentre una
      # regressione poteva arrivare in produzione lo stesso — segnalato da una
      # revisione esterna, e aveva ragione.
      # ─── UN CANCELLO, UNO STEP, E NON E' PEDANTERIA
      #
      # `npm run collaudo` incatena dieci controlli con `&&`. Quando la catena
      # cade, GitHub dice «lo step e' fallito» e basta: per sapere QUALE dei
      # dieci bisogna aprire il registro, e il registro non e' leggibile senza
      # autenticazione. Ho passato tre esecuzioni a indovinare.
      #
      # Separati, il nome dello step E' la diagnosi. Costa qualche secondo di
      # avvio in piu' e ripaga alla prima riga rossa.
      #
      # `CHROMIUM=1` vale per tutti: in CI non c'e' nessun Chrome di sistema, e
      # dirlo e' meglio che lasciarlo scoprire per tentativi.
      - { name: 'Cancello · rollio',       run: node strumenti/collaudo-rollio.mjs, timeout-minutes: 20 }
      # La catena causale dell'atto due: mancava qui mentre esisteva in
      # `npm run collaudo`. Le due liste erano divergenti in ENTRAMBI i versi --
      # scia e varco solo qui, catena solo li' -- e nessuna delle due lo diceva.
      - { name: 'Cancello · catena causale', run: node strumenti/collaudo-catena.mjs, timeout-minutes: 20 }
      - { name: 'Cancello · scafo',        run: node strumenti/collaudo-scafo.mjs, timeout-minutes: 20 }
      - { name: 'Cancello · mare',         run: node strumenti/collaudo-mare.mjs, timeout-minutes: 20 }
      - { name: 'Cancello · fantasma',     run: node strumenti/collaudo-fantasma.mjs, timeout-minutes: 20 }
      - { name: 'Cancello · filmati',      run: node strumenti/collaudo-filmato.mjs, timeout-minutes: 20 }
      - { name: 'Cancello · loop filmati', run: node strumenti/collaudo-loop.mjs, timeout-minutes: 20 }
      - name: 'Cancello · il sollievo e una conseguenza'
        timeout-minutes: 20
        run: node strumenti/collaudo-sollievo.mjs
        env: { CHROMIUM: '1' }
      - { name: 'Cancello · normali',      run: node strumenti/collaudo-normali.mjs, timeout-minutes: 20 }
      - { name: 'Cancello · modello glTF', run: node strumenti/collaudo-glb.mjs, timeout-minutes: 20 }

      # ─── D1: I CANCELLI CHE MANCAVANO, TROVATI DA `collaudo-cancelli.mjs`
      #
      # Erano nella catena locale (`npm run collaudo`) e non qui: nessuno dei
      # due era rosso, quindi la divergenza non si vedeva da nessuna parte.
      # Aprono tutti un browser -- il passo che lo installa gira gia' sopra a
      # questo punto del job, e scia/varco (piu' su) dimostrano che un
      # `apriBrowser({ conGpu: true })` regge gia' su questo runner senza GPU.
      - name: 'Cancello · il finale non taglia le persone'
        timeout-minutes: 20
        run: node strumenti/collaudo-finale.mjs
        env: { CHROMIUM: '1' }
      - name: 'Cancello · il finale respira'
        timeout-minutes: 20
        run: node strumenti/collaudo-finale-vivo.mjs
        env: { CHROMIUM: '1' }
      - name: 'Cancello · due scritte non si sovrappongono'
        timeout-minutes: 20
        run: node strumenti/collaudo-ingombri.mjs
        env: { CHROMIUM: '1' }
      - name: 'Cancello · lo scroll fa sempre qualcosa'
        timeout-minutes: 20
        run: node strumenti/collaudo-corsa-viva.mjs
        env: { CHROMIUM: '1' }
      # La fluidita' si autoriconosce su un rasterizzatore software (cerca
      # SwiftShader/llvmpipe nel renderer) e in quel caso non da' un verdetto
      # di prestazione -- stampa i numeri per debug ed esce verde. Per questo
      # puo' entrare in CI anche senza GPU vera, a differenza di orizzonte e
      # cielo qui sotto.
      - name: 'Cancello · fluidita dello scorrimento'
        timeout-minutes: 20
        run: node strumenti/collaudo-fluidita.mjs
        env: { CHROMIUM: '1' }
      # Non apre un browser: legge riferimenti/ e feedback/ e cerca righe che
      # negano l'esistenza di qualcosa che il disco smentisce. Nessuna ragione
      # per restare fuori dalla CI -- puo' girare ovunque giri Node.
      - { name: 'Cancello · i documenti non dichiarano mancanze smentite', run: node strumenti/collaudo-piano.mjs, timeout-minutes: 20 }
      # ─── LA DIVERGENZA FRA LE DUE LISTE, ADESSO DICHIARATA
      #
      # Per un giorno intero `npm run collaudo` e questo workflow non hanno
      # eseguito gli stessi cancelli, in ENTRAMBI i versi: scia e varco solo
      # qui, cielo/gltf/orizzonte/catena solo in locale. Sei su diciotto, e
      # nessuna delle due liste lo diceva. Quindi «suite verde» non ha mai
      # voluto dire «pubblicabile».
      #
      # Adesso combaciano, TRANNE DUE, e la ragione e' scritta invece che
      # taciuta: `collaudo-orizzonte` e `collaudo-cielo` misurano la STRUTTURA
      # TONALE di cio' che il motore disegna, e qui il motore e' SwiftShader --
      # nessuna GPU. Aggiunti, `orizzonte` e' uscito rosso su questo runner
      # mentre in locale passa.
      #
      # ATTENZIONE, e va detto perche' e' l'errore che ho appena fatto:
      # `CHROMIUM=1` forza il browser interno ma NON il disegno in software.
      # Su una macchina con la GPU quella prova non riproduce questo runner, e
      # io l'avevo trattata come se lo facesse. La causa vera non e' verificata:
      # i log del job servono i diritti di amministratore.
      #
      # Restano quindi LOCALI, dichiarati qui: sono cancelli sulla RESA, e la
      # resa di un rasterizzatore software non e' quella che riceve un
      # visitatore. Il giorno in cui questo runner avesse una GPU, rientrano.
      - { name: 'Cancello · validatore glTF', run: node strumenti/collaudo-gltf.mjs, timeout-minutes: 20 }
      - name: 'Cancello · continuita della scena'
        timeout-minutes: 20
        run: node strumenti/collaudo-continuita.mjs
        env: { CHROMIUM: '1' }
      # ─── LA CINEMATICA E' LOCALE, e la ragione l'ho LETTA nel log
      #
      # Bocciava la pubblicazione con «in nessun punto l'ingresso compie un
      # giro intero». Il log dice che tutti e tre i punti hanno esaurito il
      # tetto di 45 s con 35-38 campioni, e il cancello stesso li dichiara
      # «macchina lenta, non difetto» -- poi pero' boccia perche' NESSUNO ha
      # chiuso il giro. In locale almeno uno lo chiude, con 77 campioni.
      #
      # La causa non e' il numero di campioni: e' che `index.js` blocca il passo
      # a `Math.min(getDelta(), 0.05)`, cosa giusta per la stabilita'. Su un
      # rasterizzatore software a circa un fotogramma al secondo, il tempo
      # SIMULATO avanza venti volte piu' lento di quello reale: in 45 secondi di
      # orologio il meccanismo ne vive due, e un giro d'albero non ci sta.
      # Alzare il tetto vorrebbe dire portarlo a un quarto d'ora per punto.
      #
      # E' di nuovo «un cancello che misura la velocita' della macchina» -- la
      # regola che questo repo si e' dato dopo undici commit di CI rossa a fine
      # agosto. Vale ancora, e vale anche adesso: quel cancello resta in
      # `npm run collaudo`, dove la macchina e' abbastanza veloce perche' la
      # misura significhi qualcosa.
      #
      # Rientra il giorno in cui o il runner ha una GPU, o il meccanismo si puo'
      # far avanzare a passo dichiarato invece che a fotogrammi -- che e' la
      # cura vera, e non la faccio stanotte alla settima corsa.

      # La manopola deve comandare il meccanismo DENTRO il primo piano. Il
      # difetto che questo cancello ha trovato non rompeva niente: era una
      # regola di stile che spegneva i comandi proprio dove il sito ha piu'
      # da dimostrare. Nessun altro cancello poteva vederlo.
      - name: 'Cancello · la manopola comanda il meccanismo'
        timeout-minutes: 20
        run: node strumenti/collaudo-manopola.mjs
        env: { CHROMIUM: '1' }

      # ─── IL NUDGE DEL GIROSCOPIO, e perche' puo' stare qui
      #
      # E' la scoperta conclusiva dell'atto due, e fino a stasera non era
      # protetta da niente: il cancello esisteva ma non stava ne' in
      # `npm run collaudo` ne' qui. Segnalato da una revisione.
      #
      # Puo' stare in CI perche' non misura la RESA e non aspetta l'orologio:
      # fa scendere la velocita' a passo dichiarato, come la manopola. Le
      # uniche attese d'orologio sono i 600 ms fra un avanzamento e la lettura,
      # e non sono cieche -- il giro dei nudge gira su un intervallo da 250 ms,
      # quindi si aspetta il meccanismo che accende la bolla, non "un po'".
      - name: 'Cancello · il suggerimento del giroscopio arriva'
        timeout-minutes: 20
        run: node strumenti/collaudo-nudge.mjs
        env: { CHROMIUM: '1' }

      # ─── LO STATO INIZIALE, ed e' una decisione che vive in UNA riga
      #
      # Il committente ha deciso che il sito parte SPENTO e che il primo gesto
      # dell'utente accende. Una decisione di messa in scena senza un cancello
      # torna indietro da sola alla prima persona che «sistema» quella riga --
      # ed era gia' successo: `simulazione.js` dichiarava `stab: false` e
      # `stato.js` lo rimetteva a `true` venti file dopo.
      #
      # Puo' stare in CI perche' non misura la resa: legge lo stato, l'attributo
      # annunciato, e fa avanzare il rollio a passo dichiarato.
      - name: 'Cancello · si parte spenti e il gesto accende'
        timeout-minutes: 20
        run: node strumenti/collaudo-stato-iniziale.mjs
        env: { CHROMIUM: '1' }

      # Con `prefers-reduced-motion` il sito si riduce, non si spegne. Il
      # difetto che questo cancello ha trovato: il ciclo di disegno spento
      # fermava anche il VIDEO del salone -- che nessuno aveva deciso di
      # fermare, ma era attaccato a qualcosa che qualcun altro spegneva.
      - name: 'Cancello · il movimento ridotto e una versione ridotta'
        timeout-minutes: 20
        run: node strumenti/collaudo-ridotto.mjs
        env: { CHROMIUM: '1' }

      # Un cancello fuori dalla CI protegge solo quando qualcuno si ricorda di
      # eseguirlo. Questi due sono nati stanotte e guardano due promesse che
      # nessun altro guarda: che la scia risponda all'andatura, e che il varco
      # nel pelo si apra col taglio e si richiuda con lui.
      - name: 'Cancello · la scia risponde all andatura'
        timeout-minutes: 20
        run: node strumenti/collaudo-scia.mjs
        env: { CHROMIUM: '1' }

      - name: 'Cancello · il varco nel pelo si apre col taglio'
        timeout-minutes: 20
        run: node strumenti/collaudo-varco.mjs
        env: { CHROMIUM: '1' }

      # Layout, bersagli e raggiungibilita' su tre viewport da telefono. I
      # fotogrammi al secondo NON sono una misura qui (niente GPU): il
      # collaudo lo stampa in testa e in coda, e fallisce solo su cio' che sa
      # giudicare.
      - name: 'Cancello · il sito su schermi da telefono'
        timeout-minutes: 20
        run: node strumenti/collaudo-telefono.mjs
        env: { CHROMIUM: '1' }

      # ─── IL REFERTO VA DOVE SI LEGGE
      #
      # I registri di GitHub Actions non sono scaricabili senza autenticazione,
      # e questo mi ha tenuto cieco per quattro esecuzioni. Il RIEPILOGO del
      # lavoro invece si legge dall'API pubblica: se un cancello cade, il suo
      # referto finisce li' invece che in un registro chiuso.
      #
      # Vale la pena solo per i cancelli che possono fallire per ragioni
      # d'ambiente — impaginazione, font, browser — cioe' quelli che in locale
      # passano e in CI no.
      # ─── IL REFERTO ESCE COME ANNOTAZIONE
      #
      # I registri di GitHub Actions non si scaricano senza token, e il
      # riepilogo del lavoro non e' esposto dall'API pubblica: provato, torna
      # vuoto. Le ANNOTAZIONI si', da `/check-runs/{id}/annotations`. E' l'unico
      # canale per cui il referto di una CI rossa arriva a chi non ha le chiavi.
      #
      # NIENTE FILTRI. Il primo tentativo faceva `grep` delle righe
      # interessanti: non ha trovato niente, e con `set -e` lo script e' morto
      # prima di scrivere una sola annotazione. Un meccanismo di diagnosi che
      # ha bisogno di indovinare quali righe contano fallisce proprio quando
      # serve. Si versano le ultime venticinque e basta.
      - name: Collaudo dell'impaginato
        timeout-minutes: 20
        run: |
          set -o pipefail
          if ! npm run collaudo:impaginato 2>&1 | tee /tmp/imp.txt; then
            tail -25 /tmp/imp.txt | while IFS= read -r r; do
              echo "::error::$r"
            done
            exit 1
          fi
        env:
          CHROMIUM: '1'

      # Il peso si misura a ogni pubblicazione e finisce nel registro della
      # corsa: se un giorno cresce, si vede quando e' successo e per cosa.
      # Gira anche dentro `npm run collaudo`: qui resta perche' la sua uscita
      # e' il registro, e un registro si vuole leggere anche quando tutto passa.
      - run: npm run peso
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pubblica:
    needs: compila
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblicazione.outputs.page_url }}
    steps:
      - id: pubblicazione
        uses: actions/deploy-pages@v4
